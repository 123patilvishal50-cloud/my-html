
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vishalyaa - Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #141e30, #243b55);
    }

    .login-box {
      width: 350px;
      padding: 35px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      color: #243b55;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: #2878d0;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2878d0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #185ca8;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #888;
      font-size: 19px;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h1>Viyaaa</h1>
    <p class="subtitle">Welcome Back! my webside</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Enter your username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">Login</button>
      <p id="message" role="status"></p>
    </form>

    <p class="footer">© 2026 Viyaaa. All rights reserved.</p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (username === "admin" && password === "12345") {
        message.style.color = "green";
        message.textContent = "Login successful!";
      } else {
        message.style.color = "red";
        message.textContent = "Invalid username or password!";
      }
    });
  </script>
</body>
</html>
